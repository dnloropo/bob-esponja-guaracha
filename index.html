<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bob Esponja CSS</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #4fc3f7; /* agua del mar */
      font-family: sans-serif;
    }

    /* Lienzo: todas las piezas se colocan encima con position: absolute */
    .bob {
      position: relative;
      width: 320px;
      height: 440px;
      margin-top: 70px; /* espacio para la gorra */
    }

    .bob div {
      position: absolute;
      box-sizing: border-box;
    }

    /* ---------- Brazos (van primero para quedar detras) ---------- */
    .brazo     { top: 255px; width: 14px; height: 95px; background: #fff200; border: 2px solid #b5a300; }
    .brazo.izq { left: 22px; }
    .brazo.der { left: 284px; }

    .manga     { top: 248px; width: 36px; height: 26px; background: #fff; border: 2px solid #999; border-radius: 6px; }
    .manga.izq { left: 10px; }
    .manga.der { left: 274px; }

    /* ---------- Cuerpo ---------- */
    .cuerpo {
      left: 40px; top: 0;
      width: 240px; height: 255px;
      background: #fff200;
      border: 4px solid #b5a300;
      border-radius: 10px;
    }

    /* Hoyos de la esponja */
    .hoyo { background: #c8c000; border-radius: 50%; }
    .h1 { left: 58px;  top: 18px;  width: 22px; height: 16px; }
    .h2 { left: 240px; top: 30px;  width: 18px; height: 24px; }
    .h3 { left: 60px;  top: 200px; width: 26px; height: 18px; }
    .h4 { left: 238px; top: 190px; width: 20px; height: 20px; }
    .h5 { left: 150px; top: 15px;  width: 14px; height: 12px; }

    /* ---------- Ojos: blanco, iris azul, pupila negra ---------- */
    .ojo { top: 45px; width: 76px; height: 76px; background: #fff; border: 3px solid #333; border-radius: 50%; }
    .ojo.izq { left: 84px; }
    .ojo.der { left: 160px; }

    .iris { top: 66px; width: 34px; height: 34px; background: #2196f3; border: 2px solid #0d47a1; border-radius: 50%; }
    .iris.izq { left: 109px; }
    .iris.der { left: 181px; }

    .pupila { top: 75px; width: 16px; height: 16px; background: #000; border-radius: 50%; }
    .pupila.izq { left: 118px; }
    .pupila.der { left: 190px; }

    /* Pestañas */
    .pestana { top: 30px; width: 4px; height: 18px; background: #000; }
    .p1 { left: 104px; transform: rotate(-20deg); }
    .p2 { left: 120px; }
    .p3 { left: 136px; transform: rotate(20deg); }
    .p4 { left: 180px; transform: rotate(-20deg); }
    .p5 { left: 196px; }
    .p6 { left: 212px; transform: rotate(20deg); }

    /* ---------- Nariz ---------- */
    .nariz {
      left: 150px; top: 108px;
      width: 22px; height: 34px;
      background: #fff200;
      border: 3px solid #b5a300;
      border-radius: 50%;
    }

    /* ---------- Cachetes ---------- */
    .cachete { top: 140px; width: 30px; height: 30px; background: #ff9db5; border-radius: 50%; }
    .cachete.izq { left: 72px; }
    .cachete.der { left: 218px; }

    /* ---------- Boca y dientes ---------- */
    .boca {
      left: 92px; top: 150px;
      width: 136px; height: 55px;
      background: #8b0018;
      border: 3px solid #4a0010;
      border-radius: 0 0 70px 70px;
    }

    .diente { top: 150px; width: 20px; height: 22px; background: #fff; border: 2px solid #999; }
    .diente.izq { left: 138px; }
    .diente.der { left: 162px; }

    /* ---------- Camisa y corbata ---------- */
    .camisa {
      left: 40px; top: 250px;
      width: 240px; height: 42px;
      background: #fff;
      border: 3px solid #999;
    }

    .cuello { top: 250px; width: 30px; height: 18px; background: #fff; border: 2px solid #999; }
    .cuello.izq { left: 128px; transform: skewX(30deg); }
    .cuello.der { left: 162px; transform: skewX(-30deg); }

    .nudo    { left: 151px; top: 252px; width: 18px; height: 14px; background: #e53935; }
    .corbata { left: 148px; top: 264px; width: 24px; height: 46px; background: #e53935; border-radius: 0 0 6px 6px; }

    /* ---------- Pantalon y cinturon ---------- */
    .pantalon {
      left: 40px; top: 290px;
      width: 240px; height: 45px;
      background: #8d5a2b;
      border: 3px solid #5a3510;
    }

    .cinturon { top: 300px; width: 30px; height: 8px; background: #000; }
    .c1 { left: 60px; }
    .c2 { left: 110px; }
    .c3 { left: 180px; }
    .c4 { left: 230px; }

    /* ---------- Piernas, medias y zapatos ---------- */
    .bota { top: 333px; width: 40px; height: 22px; background: #8d5a2b; border: 3px solid #5a3510; }
    .bota.izq { left: 88px; }
    .bota.der { left: 192px; }

    .pierna { top: 355px; width: 14px; height: 30px; background: #fff200; border: 2px solid #b5a300; }
    .pierna.izq { left: 101px; }
    .pierna.der { left: 205px; }

    .media {
      top: 383px; width: 14px; height: 30px;
      background: #fff;
      border: 2px solid #999;
      border-top: 5px solid #e53935;   /* raya roja */
      border-bottom: 5px solid #2196f3; /* raya azul */
    }
    .media.izq { left: 101px; }
    .media.der { left: 205px; }

    .zapato { top: 410px; width: 52px; height: 24px; background: #111; border-radius: 14px 14px 4px 4px; }
    .zapato.izq { left: 70px; }
    .zapato.der { left: 198px; }

    /* ---------- Gafas de ciclismo (visor envolvente espejado) ---------- */
    .patilla { top: 72px; width: 32px; height: 8px; background: #111; }
    .patilla.izq { left: 44px; }
    .patilla.der { left: 244px; }

    /* Un lente por cada ojo, espejado tornasol */
    .lente {
      top: 42px;
      width: 88px; height: 84px;
      background: linear-gradient(120deg, #ff4081, #7c4dff 35%, #00e5ff 65%, #ffea00);
      border: 4px solid #111;
    }
    .lente.izq { left: 72px;  border-radius: 24px 34px 30px 44px; }
    .lente.der { left: 160px; border-radius: 34px 24px 44px 30px; }

    /* Puente que une los dos lentes */
    .puente { left: 150px; top: 58px; width: 20px; height: 10px; background: #111; border-radius: 3px; }

    /* Reflejo de luz sobre cada lente */
    .brillo {
      top: 52px;
      width: 36px; height: 8px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 6px;
      transform: skewX(-30deg);
    }
    .brillo.izq { left: 88px; }
    .brillo.der { left: 176px; }

    /* ---------- Gorra Hugo Boss ---------- */
    .gorra {
      left: 62px; top: -54px;
      width: 196px; height: 62px;
      background: #111;
      border-radius: 98px 98px 6px 6px / 62px 62px 6px 6px;
      color: #fff;
      font: bold 15px/1 Helvetica, Arial, sans-serif;
      letter-spacing: 3px;
      text-align: center;
      padding-top: 28px;
    }
    .boton  { left: 152px; top: -60px; width: 16px; height: 10px; background: #111; border-radius: 50%; }
    .visera { left: 48px;  top: 2px;   width: 224px; height: 18px; background: #222; border-radius: 50%; }

    /* ---------- Lunar rosado en la nariz (mismo tono que la bolsa) ---------- */
    .lunar { left: 159px; top: 124px; width: 8px; height: 8px; background: #ff69b4; border-radius: 50%; }

    /* ---------- Bolsita ziploc en la mano derecha ---------- */
    .bolsa {
      left: 274px; top: 348px;
      width: 34px; height: 42px;
      /* arriba transparente, abajo el contenido rosado */
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.45) 40%, #ff69b4 40%);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-top: 5px solid #1e88e5; /* el cierre zip */
      border-radius: 3px 3px 6px 6px;
      /* gira desde el mismo hombro que el brazo, asi se mueve con la mano */
      transform-origin: 17px -93px;
      animation: brazo-der 0.94s ease-in-out infinite;
    }

    /* ---------- Cigarrillo verde encendido en la mano izquierda ---------- */
    /* Todas las piezas giran desde el hombro izquierdo (x 29, y 255) con el brazo */
    .cigarro {
      left: -6px; top: 344px;
      width: 36px; height: 7px;
      /* papel verde y filtro naranja (en la mano) */
      background: linear-gradient(to right, #43a047 78%, #d9903d 78%);
      border-radius: 2px;
      transform-origin: 35px -89px;
      animation: brazo-izq 0.94s ease-in-out infinite;
    }

    .brasa {
      left: -9px; top: 343px;
      width: 6px; height: 9px;
      background: #ff3d00;
      border-radius: 50%;
      transform-origin: 38px -88px;
      animation: brazo-izq 0.94s ease-in-out infinite,
                 encendido 0.6s ease-in-out infinite alternate;
    }

    /* Humo que sube y se desvanece */
    .humo {
      left: -14px; top: 330px;
      width: 12px; height: 12px;
      background: rgba(230, 230, 230, 0.8);
      border-radius: 50%;
      transform-origin: 43px -75px;
      animation: brazo-izq 0.94s ease-in-out infinite,
                 humo 1.6s ease-out infinite;
    }
    .humo.h-2 { animation-delay: 0s, -0.8s; }

    @keyframes encendido {
      from { box-shadow: 0 0 4px 1px #ff9100; }
      to   { box-shadow: 0 0 10px 4px #ffc400; }
    }
    @keyframes humo {
      from { translate: 0 0;        opacity: 0.8; }
      to   { translate: -10px -40px; opacity: 0; }
    }

    h1 {
      font-size: 72px;
      margin: 10px 0 30px;
      color: #ffeb3b;
      text-shadow: 4px 4px 0 #000;
      animation: latido 0.47s ease-in-out infinite;
    }

    /* ================= ANIMACIONES ================= */

    /* Parpadeo: el ojo se aplasta (scale) y las pestañas bajan (translate) */
    .ojo, .iris, .pupila { animation: parpadeo 3s infinite; }
    .pestana             { animation: pestanas 3s infinite; }

    @keyframes parpadeo {
      0%, 92%, 100% { scale: 1 1; }
      95%           { scale: 1 0.1; }
    }
    @keyframes pestanas {
      0%, 92%, 100% { translate: 0 0; }
      95%           { translate: 0 34px; }
    }

    /* Guaracha: todo Bob se balancea de lado a lado y rebota */
    .bob {
      transform-origin: 50% 100%;
      animation: guaracha 0.94s ease-in-out infinite;
    }
    @keyframes guaracha {
      0%   { transform: rotate(-8deg) translateY(0); }
      25%  { transform: rotate(0deg)  translateY(-18px); }
      50%  { transform: rotate(8deg)  translateY(0); }
      75%  { transform: rotate(0deg)  translateY(-18px); }
      100% { transform: rotate(-8deg) translateY(0); }
    }

    /* Brazos arriba y abajo (giran desde el hombro) */
    .brazo.izq { transform-origin: 7px 0;    animation: brazo-izq 0.94s ease-in-out infinite; }
    .manga.izq { transform-origin: 19px 7px; animation: brazo-izq 0.94s ease-in-out infinite; }
    .brazo.der { transform-origin: 7px 0;    animation: brazo-der 0.94s ease-in-out infinite; }
    .manga.der { transform-origin: 17px 7px; animation: brazo-der 0.94s ease-in-out infinite; }

    @keyframes brazo-izq {
      0%, 100% { rotate: 20deg; }
      50%      { rotate: 150deg; }
    }
    @keyframes brazo-der {
      0%, 100% { rotate: -150deg; }
      50%      { rotate: -20deg; }
    }

    /* Pasitos: las piernas suben una y luego la otra */
    .bota.izq, .pierna.izq, .media.izq, .zapato.izq {
      animation: paso 0.47s ease-in-out infinite;
    }
    .bota.der, .pierna.der, .media.der, .zapato.der {
      animation: paso 0.47s ease-in-out infinite;
      animation-delay: -0.235s;
    }
    @keyframes paso {
      0%, 100% { translate: 0 0; }
      50%      { translate: 0 -14px; }
    }

    /* Luces de fiesta en el fondo */
    body { animation: fiesta 1.88s linear infinite; }
    @keyframes fiesta {
      0%, 100% { background: #4fc3f7; }
      33%      { background: #ba68c8; }
      66%      { background: #ff8a65; }
    }

    @keyframes latido {
      0%, 100% { scale: 1; }
      50%      { scale: 1.12; }
    }
  </style>
</head>
<body>
  <div class="bob">
    <div class="brazo izq"></div>
    <div class="brazo der"></div>
    <div class="manga izq"></div>
    <div class="manga der"></div>

    <div class="cuerpo"></div>
    <div class="hoyo h1"></div>
    <div class="hoyo h2"></div>
    <div class="hoyo h3"></div>
    <div class="hoyo h4"></div>
    <div class="hoyo h5"></div>

    <div class="pestana p1"></div>
    <div class="pestana p2"></div>
    <div class="pestana p3"></div>
    <div class="pestana p4"></div>
    <div class="pestana p5"></div>
    <div class="pestana p6"></div>
    <div class="ojo izq"></div>
    <div class="ojo der"></div>
    <div class="iris izq"></div>
    <div class="iris der"></div>
    <div class="pupila izq"></div>
    <div class="pupila der"></div>
    <div class="patilla izq"></div>
    <div class="patilla der"></div>
    <div class="lente izq"></div>
    <div class="lente der"></div>
    <div class="puente"></div>
    <div class="brillo izq"></div>
    <div class="brillo der"></div>

    <div class="gorra">HUGO BOSS</div>
    <div class="boton"></div>
    <div class="visera"></div>

    <div class="cachete izq"></div>
    <div class="cachete der"></div>
    <div class="boca"></div>
    <div class="diente izq"></div>
    <div class="diente der"></div>
    <div class="nariz"></div>
    <div class="lunar"></div>

    <div class="pantalon"></div>
    <div class="cinturon c1"></div>
    <div class="cinturon c2"></div>
    <div class="cinturon c3"></div>
    <div class="cinturon c4"></div>
    <div class="camisa"></div>
    <div class="cuello izq"></div>
    <div class="cuello der"></div>
    <div class="nudo"></div>
    <div class="corbata"></div>

    <div class="pierna izq"></div>
    <div class="pierna der"></div>
    <div class="media izq"></div>
    <div class="media der"></div>
    <div class="bota izq"></div>
    <div class="bota der"></div>
    <div class="zapato izq"></div>
    <div class="zapato der"></div>

    <div class="bolsa"></div>

    <div class="humo"></div>
    <div class="humo h-2"></div>
    <div class="cigarro"></div>
    <div class="brasa"></div>
  </div>

  <h1>sobelo</h1>
</body>
</html>
